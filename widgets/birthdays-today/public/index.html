<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Birthdays today</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #111827;
    }

    body {
      padding: 2px;
      box-sizing: border-box;
    }

    .card {
      height: calc(100% - 4px);
      padding: 16px;
      box-sizing: border-box;
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.08),
        0 2px 8px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .appIcon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #ef35aa;
      box-shadow: 0 8px 20px rgba(239, 53, 170, 0.28);
      position: relative;
      flex: 0 0 auto;
    }

    .appIcon::before {
      content: "";
      position: absolute;
      inset: 10px;
      background: #ffffff;
      mask: url("./icon.svg") center / contain no-repeat;
      -webkit-mask: url("./icon.svg") center / contain no-repeat;
    }

    .title {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 700;
      color: rgba(17, 24, 39, 0.56);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 118px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(239, 53, 170, 0.10);
      box-shadow: inset 0 0 0 1px rgba(239, 53, 170, 0.10);
    }

    .dateBadge {
      min-width: 46px;
      height: 42px;
      border-radius: 15px;
      background: rgba(239, 53, 170, 0.16);
      color: #ef35aa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .day {
      font-size: 13px;
      line-height: 1;
      font-weight: 950;
      text-transform: lowercase;
    }

    .dayLabel {
      margin-top: 2px;
      font-size: 9px;
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .name {
      font-size: 14px;
      font-weight: 900;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ageInline {
      margin-left: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #ef35aa;
      white-space: nowrap;
    }

    .meta {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 700;
      color: rgba(17, 24, 39, 0.62);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .emptyTitle {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .emptyText {
      margin-top: 7px;
      max-width: 260px;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      color: rgba(17, 24, 39, 0.62);
    }

    @media (prefers-color-scheme: dark) {
      html,
      body {
        color: #f8fafc;
      }

      .card {
        background: rgba(15, 23, 42, 0.94);
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.35),
          0 2px 10px rgba(0, 0, 0, 0.18);
      }

      .subtitle,
      .meta,
      .emptyText {
        color: rgba(248, 250, 252, 0.68);
      }

      .person {
        background: rgba(239, 53, 170, 0.14);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .dateBadge {
        background: rgba(239, 53, 170, 0.20);
      }
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <div class="empty" aria-live="polite"></div>
  </div>
  <script type="text/javascript">
    function onHomeyReady(Homey) {
      Homey.ready(); const card=document.getElementById('card');
      const translations={"en":{"today":"Birthdays today","count":"birthday(s)","none":"No birthdays","empty":"No birthdays today","help":"Add birthdays in the app settings to show them here.","loading":"Loading birthdays...","loadError":"Could not load birthdays","baby":"Baby","years":"years","todayStatus":"Birthday today","congrats":"Congratulations 🎉","monthTitle":"Birthdays this month","thisMonth":"this month","emptyMonth":"No birthdays this month","inDays":"In {n} day(s)","past":"Passed"},"nl":{"today":"Vandaag jarig","count":"verjaardag(en)","none":"Geen verjaardagen","empty":"Vandaag is er niemand jarig","help":"Voeg verjaardagen toe in de app-instellingen om ze hier te tonen.","loading":"Verjaardagen laden...","loadError":"Kon verjaardagen niet laden","baby":"Baby","years":"jaar","todayStatus":"Vandaag jarig","congrats":"Gefeliciteerd 🎉","monthTitle":"Verjaardagen deze maand","thisMonth":"deze maand","emptyMonth":"Geen verjaardagen deze maand","inDays":"Over {n} dag(en)","past":"Geweest"},"de":{"today":"Heutige Geburtstage","count":"Geburtstag/Geburtstage","none":"Keine Geburtstage","empty":"Heute hat niemand Geburtstag","help":"Füge Geburtstage in den App-Einstellungen hinzu, um sie hier anzuzeigen.","loading":"Geburtstage werden geladen...","loadError":"Geburtstage konnten nicht geladen werden","baby":"Baby","years":"Jahre","todayStatus":"Hat heute Geburtstag","congrats":"Herzlichen Glückwunsch 🎉","monthTitle":"Geburtstage diesen Monat","thisMonth":"dieser Monat","emptyMonth":"Keine Geburtstage diesen Monat","inDays":"In {n} Tag(en)","past":"Vorbei"},"fr":{"today":"Anniversaires aujourd’hui","count":"anniversaire(s)","none":"Aucun anniversaire","empty":"Personne ne fête son anniversaire aujourd’hui","help":"Ajoutez des anniversaires dans les réglages de l’application pour les afficher ici.","loading":"Chargement des anniversaires...","loadError":"Impossible de charger les anniversaires","baby":"Bébé","years":"ans","todayStatus":"Anniversaire aujourd’hui","congrats":"Joyeux anniversaire 🎉","monthTitle":"Anniversaires ce mois-ci","thisMonth":"ce mois-ci","emptyMonth":"Aucun anniversaire ce mois-ci","inDays":"Dans {n} jour(s)","past":"Passé"},"it":{"today":"Compleanni di oggi","count":"compleanno/i","none":"Nessun compleanno","empty":"Oggi non compie gli anni nessuno","help":"Aggiungi i compleanni nelle impostazioni dell’app per visualizzarli qui.","loading":"Caricamento compleanni...","loadError":"Impossibile caricare i compleanni","baby":"Bebè","years":"anni","todayStatus":"Compleanno oggi","congrats":"Buon compleanno 🎉","monthTitle":"Compleanni di questo mese","thisMonth":"questo mese","emptyMonth":"Nessun compleanno questo mese","inDays":"Tra {n} giorno/i","past":"Passato"},"sv":{"today":"Födelsedagar idag","count":"födelsedag(ar)","none":"Inga födelsedagar","empty":"Ingen fyller år idag","help":"Lägg till födelsedagar i appinställningarna för att visa dem här.","loading":"Laddar födelsedagar...","loadError":"Kunde inte ladda födelsedagar","baby":"Baby","years":"år","todayStatus":"Fyller år idag","congrats":"Grattis 🎉","monthTitle":"Födelsedagar denna månad","thisMonth":"denna månad","emptyMonth":"Inga födelsedagar denna månad","inDays":"Om {n} dag(ar)","past":"Har varit"},"no":{"today":"Bursdager i dag","count":"bursdag(er)","none":"Ingen bursdager","empty":"Ingen har bursdag i dag","help":"Legg til bursdager i appinnstillingene for å vise dem her.","loading":"Laster bursdager...","loadError":"Kunne ikke laste bursdager","baby":"Baby","years":"år","todayStatus":"Har bursdag i dag","congrats":"Gratulerer 🎉","monthTitle":"Bursdager denne måneden","thisMonth":"denne måneden","emptyMonth":"Ingen bursdager denne måneden","inDays":"Om {n} dag(er)","past":"Har vært"},"es":{"today":"Cumpleaños de hoy","count":"cumpleaños","none":"No hay cumpleaños","empty":"Hoy no cumple años nadie","help":"Añade cumpleaños en los ajustes de la app para mostrarlos aquí.","loading":"Cargando cumpleaños...","loadError":"No se pudieron cargar 다","baby":"아기","years":"세","todayStatus":"오늘 생일","congrats":"생일 축하합니다 🎉","monthTitle":"이번 달 생일","thisMonth":"이번 달","emptyMonth":"이번 달에는 생일이 없습니다","inDays":"{n}일 후","past":"지남"},"ar":{"today":"أعياد ميلاد اليوم","count":"عيد ميلاد","none":"لا توجد أعياد ميلاد","empty":"لا أحد يحتفل بعيد ميلاده اليوم","help":"أضف أعياد الميلاد في إعدادات التطبيق لعرضها هنا.","loading":"جارٍ تحميل أعياد الميلاد...","loadError":"تعذر تحميل أعياد الميلاد","baby":"رضيع","years":"سنة","todayStatus":"عيد ميلاده اليوم","congrats":"عيد ميلاد سعيد 🎉","monthTitle":"أعياد ميلاد هذا الشهر","thisMonth":"هذا الشهر","emptyMonth":"لا توجد أعياد ميلاد هذا الشهر","inDays":"بعد {n} يوم","past":"مضى"}};
      function escapeHtml(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
      function tr(data){const l=data&&translations[data.language]?data.language:'en';return translations[l]}
      function ageText(p,t){return p.isBaby||p.age===null||p.age===undefined?t.baby:p.age+' '+t.years}
      function render(data){const list=data&&Array.isArray(data.birthdays)?data.birthdays:[],t=tr(data);document.documentElement.lang=data.language||'en';document.documentElement.dir=(data.language==='ar'?'rtl':'ltr');document.title=t.today;
        const header=`<div class="header"><div class="appIcon" aria-label="Birthdays"></div><div><div class="title">${escapeHtml(t.today)}</div><div class="subtitle">${escapeHtml(list.length?list.length+' '+t.count:t.none)}</div></div></div>`;if(!list.length){card.innerHTML=header+`<div class="empty"><div class="emptyTitle">${escapeHtml(t.empty)}</div><div class="emptyText">${escapeHtml(t.help)}</div></div>`;return}card.innerHTML=header+'<div class="list">'+list.map(p=>`<div class="person"><div class="dateBadge"><div class="day">${escapeHtml(t.todayStatus)}</div></div><div class="info"><div class="name">${escapeHtml(p.name)} <span class="ageInline">${escapeHtml(ageText(p,t))}</span></div><div class="meta">${escapeHtml(t.todayStatus||t.congrats)}</div></div></div>`).join('')+'</div>';}
      function preferred(){const language=(Homey.getLanguage&&Homey.getLanguage())||document.documentElement.lang||navigator.language.slice(0,2);return translations[language]||translations.en}card.textContent=preferred().loading;
      function loadData(){Homey.api('GET','/',{}).then(d=>render(d||{})).catch(()=>{card.innerHTML='<div class="empty">'+escapeHtml(preferred().loadError)+'</div>'})}loadData();setInterval(loadData,60000);
    }
  </script>
</body>
</html>
