<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />

  <style>
    :root {
      color-scheme: light dark;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #111827;
    }

    body {
      padding: 2px;
      box-sizing: border-box;
    }

    .card {
      height: calc(100% - 4px);
      padding: 16px;
      box-sizing: border-box;
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.08),
        0 2px 8px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .appIcon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #ef35aa;
      box-shadow: 0 8px 20px rgba(239, 53, 170, 0.28);
      position: relative;
      flex: 0 0 auto;
    }

    .appIcon::before {
      content: "";
      position: absolute;
      inset: 10px;
      background: #ffffff;
      mask: url("./icon.svg") center / contain no-repeat;
      -webkit-mask: url("./icon.svg") center / contain no-repeat;
    }

    .title {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 700;
      color: rgba(17, 24, 39, 0.56);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 118px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(239, 53, 170, 0.10);
      box-shadow: inset 0 0 0 1px rgba(239, 53, 170, 0.10);
    }

    .dateBadge {
      min-width: 46px;
      height: 42px;
      border-radius: 15px;
      background: rgba(239, 53, 170, 0.16);
      color: #ef35aa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .day {
      font-size: 13px;
      line-height: 1;
      font-weight: 950;
      text-transform: lowercase;
    }

    .dayLabel {
      margin-top: 2px;
      font-size: 9px;
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .name {
      font-size: 14px;
      font-weight: 900;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ageInline {
      margin-left: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #ef35aa;
      white-space: nowrap;
    }

    .meta {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 700;
      color: rgba(17, 24, 39, 0.62);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .emptyTitle {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .emptyText {
      margin-top: 7px;
      max-width: 260px;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      color: rgba(17, 24, 39, 0.62);
    }

    @media (prefers-color-scheme: dark) {
      html,
      body {
        color: #f8fafc;
      }

      .card {
        background: rgba(15, 23, 42, 0.94);
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.35),
          0 2px 10px rgba(0, 0, 0, 0.18);
      }

      .subtitle,
      .meta,
      .emptyText {
        color: rgba(248, 250, 252, 0.68);
      }

      .person {
        background: rgba(239, 53, 170, 0.14);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .dateBadge {
        background: rgba(239, 53, 170, 0.20);
      }
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <div class="empty">Verjaardagen laden...</div>
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      Homey.ready();

      const card = document.getElementById('card');

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getAgeText(person) {
        if (person.isBaby || person.age === null || person.age === undefined) {
          return 'Baby';
        }

        return person.age + ' jaar';
      }

      function render(data) {
        const birthdays = data && Array.isArray(data.birthdays) ? data.birthdays : [];

        const header = `
          <div class="header">
            <div class="appIcon" aria-label="Birthdays"></div>

            <div>
              <div class="title">Jarig vandaag</div>
              <div class="subtitle">
                ${birthdays.length
                  ? birthdays.length + ' verjaardag(en)'
                  : 'Geen verjaardagen'}
              </div>
            </div>
          </div>
        `;

        if (!birthdays.length) {
          card.innerHTML = `
            ${header}

            <div class="empty">
              <div class="emptyTitle">
                Vandaag is er niemand jarig
              </div>

              <div class="emptyText">
                Voeg verjaardagen toe in de app-instellingen om ze hier te tonen.
              </div>
            </div>
          `;

          return;
        }

        card.innerHTML = `
          ${header}

          <div class="list">
            ${birthdays.map(function(person) {
              const ageText = getAgeText(person);

              const meta = 'Vandaag jarig';

              return `
                <div class="person">
                  <div class="dateBadge">
                    <div class="day">vandaag</div>
                  </div>

                  <div class="info">
                    <div class="name">
                      ${escapeHtml(person.name)}

                      <span class="ageInline">
                        ${escapeHtml(ageText)}
                      </span>
                    </div>

                    <div class="meta">
                      ${escapeHtml(meta || 'Gefeliciteerd 🎉')}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      function loadData() {
        Homey.api('GET', '/', {})
          .then(function(data) {
            render(data || {});
          })
          .catch(function() {
            card.innerHTML = '<div class="empty">Kon verjaardagen niet laden</div>';
          });
      }

      loadData();
      setInterval(loadData, 60000);
    }
  </script>
</body>
</html>
