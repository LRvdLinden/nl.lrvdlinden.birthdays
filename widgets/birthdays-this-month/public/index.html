<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />

  <style>
    :root {
      color-scheme: light dark;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #111827;
    }

    body {
      padding: 2px;
      box-sizing: border-box;
    }

    .card {
      height: calc(100% - 4px);
      padding: 14px;
      box-sizing: border-box;
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.08),
        0 2px 8px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .appIcon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(239, 53, 170, 0.22);
    }

    .title {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 700;
      color: rgba(17, 24, 39, 0.56);
      text-transform: capitalize;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: calc(100% - 58px);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 16px;
      background: rgba(239, 53, 170, 0.10);
      box-shadow: inset 0 0 0 1px rgba(239, 53, 170, 0.10);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      object-fit: cover;
      flex: 0 0 auto;
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .name {
      font-size: 14px;
      font-weight: 900;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 700;
      color: rgba(17, 24, 39, 0.62);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dateBadge {
      min-width: 42px;
      height: 42px;
      border-radius: 15px;
      background: rgba(239, 53, 170, 0.16);
      color: #ef35aa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .day {
      font-size: 18px;
      line-height: 1;
      font-weight: 950;
    }

    .dayLabel {
      margin-top: 2px;
      font-size: 9px;
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
    }

    .empty {
      height: calc(100% - 58px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .emptyTitle {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .emptyText {
      margin-top: 7px;
      max-width: 260px;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      color: rgba(17, 24, 39, 0.62);
    }

    @media (prefers-color-scheme: dark) {
      html,
      body {
        color: #f8fafc;
      }

      .card {
        background: rgba(15, 23, 42, 0.94);
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.35),
          0 2px 10px rgba(0, 0, 0, 0.18);
      }

      .subtitle,
      .meta,
      .emptyText {
        color: rgba(248, 250, 252, 0.68);
      }

      .person {
        background: rgba(239, 53, 170, 0.14);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .dateBadge {
        background: rgba(239, 53, 170, 0.20);
      }
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <div class="empty">Verjaardagen laden...</div>
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      Homey.ready();

      const card = document.getElementById('card');

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getStatusText(person) {
        if (person.daysUntil === 0) return 'Vandaag jarig';
        if (person.daysUntil > 0) return 'Over ' + person.daysUntil + ' dag(en)';
        return person.isBaby || person.age === null ? 'Geweest' : person.age + ' jaar geworden';
      }

      function render(data) {
        const birthdays = data && Array.isArray(data.birthdays) ? data.birthdays : [];
        const month = data && data.month ? data.month : 'deze maand';

        const header = `
          <div class="header">
            <img
              class="appIcon"
              src="https://raw.githubusercontent.com/LRvdLinden/Homey_Brands/main/Birthdays/birthday_card.png"
              alt="Birthdays"
            >
            <div>
              <div class="title">Verjaardagen deze maand</div>
              <div class="subtitle">${escapeHtml(month)} · ${birthdays.length} verjaardag(en)</div>
            </div>
          </div>
        `;

        if (!birthdays.length) {
          card.innerHTML = `
            ${header}
            <div class="empty">
              <div class="emptyTitle">Geen verjaardagen deze maand</div>
              <div class="emptyText">
                Voeg verjaardagen toe in de app-instellingen om ze hier te tonen.
              </div>
            </div>
          `;
          return;
        }

        card.innerHTML = `
          ${header}
          <div class="list">
            ${birthdays.map(function(person) {
              const meta = [
                person.category,
                getStatusText(person),
              ].filter(Boolean).join(' · ');

              return `
                <div class="person">
                  <img class="avatar" src="${escapeHtml(person.imageUrl)}" alt="">
                  <div class="info">
                    <div class="name">${escapeHtml(person.name)}</div>
                    <div class="meta">${escapeHtml(meta)}</div>
                  </div>
                  <div class="dateBadge">
                    <div class="day">${escapeHtml(person.day)}</div>
                    <div class="dayLabel">dag</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      function loadData() {
        Homey.api('GET', '/', {})
          .then(function(data) {
            render(data || {});
          })
          .catch(function() {
            card.innerHTML = '<div class="empty">Kon verjaardagen niet laden</div>';
          });
      }

      loadData();
      setInterval(loadData, 60000);
    }
  </script>
</body>
</html>
