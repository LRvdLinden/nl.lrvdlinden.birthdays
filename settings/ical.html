<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title data-i18n="settings.ical.title">iCal calendars</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="style/styles.css">
  <link rel="stylesheet" href="css/framework7-icons.css">
  <script src="/homey.js" data-origin="settings"></script>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --card:#fff; --text:#17233d; --muted:#8b9098; --line:#e5e7eb; --field:#fff; --shadow:0 5px 18px rgba(17,24,39,.08); --blue:#168cf4; --danger:#e53935; }
    * { box-sizing:border-box; }
    body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-text-size-adjust:100%; }
    .ical-content { padding:0 20px 32px; }
    .buttons-container { padding:0 20px; background:var(--bg) !important; }
    .banner { width:100%; max-width:620px; display:block; margin:0 auto 8px; }
    h1 { margin:2px 0 22px; font-size:28px; line-height:1.2; }
    .section-title { margin:28px 2px 10px; color:var(--muted); font-size:13px; font-weight:750; letter-spacing:.03em; text-transform:uppercase; }
    .card { width:100%; margin-bottom:14px; padding:17px; border:1px solid var(--line); border-radius:18px; background:var(--card); box-shadow:var(--shadow); overflow:hidden; }
    h1, .source-name, .back-button-text { color:var(--text) !important; }
    label, .section-title, .source-type, .source-meta, #status { color:var(--muted) !important; }
    input { color:var(--text) !important; -webkit-text-fill-color:var(--text); opacity:1; }
    input::placeholder { color:var(--muted) !important; -webkit-text-fill-color:var(--muted); opacity:1; }
    input[type="file"]::file-selector-button { color:var(--text); background:var(--field); border:1px solid var(--line); border-radius:8px; padding:7px 9px; }
    .homey-button-primary-full { color:#fff !important; }
    .homey-button-secondary-full { color:var(--blue) !important; }
    .homey-button-danger-shadow { color:var(--danger) !important; }
    .field { width:100%; margin-bottom:15px; }
    .field:last-child { margin-bottom:0; }
    label { display:block; width:100%; margin:0 0 7px; color:var(--muted); font-size:14px; font-weight:600; }
    input { display:block; width:100%; min-width:0; height:48px; padding:0 13px; border:1px solid var(--line); border-radius:12px; background:var(--field); color:var(--text); font:inherit; }
    input[type="file"] { height:auto; min-height:48px; padding:11px; }
    #ical-add, #ical-import, #ical-sync { width:100%; min-height:48px; }
    button:disabled { opacity:.55; }
    .source-card { position:relative; }
    .source-top { display:flex; align-items:flex-start; gap:10px; }
    .source-copy { flex:1; min-width:0; }
    .source-name { display:block; font-size:17px; font-weight:750; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .source-type,.source-meta { display:block; margin-top:4px; color:var(--muted); font-size:12px; line-height:1.4; }
    .source-url { margin-top:10px; padding:10px; border-radius:10px; background:color-mix(in srgb,var(--muted) 9%,transparent); color:var(--muted); font-size:12px; line-height:1.45; overflow-wrap:anywhere; word-break:break-word; }
    .source-error { margin-top:10px; padding:10px; border-radius:10px; background:color-mix(in srgb,var(--danger) 12%,transparent); color:var(--danger); font-size:12px; line-height:1.45; overflow-wrap:anywhere; }
    .ical-remove-button { flex:0 0 auto; width:auto; min-height:36px; }
    .empty { color:var(--muted); text-align:center; box-shadow:none; }
    #status { min-height:20px; margin:12px 2px; color:var(--muted); font-size:13px; line-height:1.45; overflow-wrap:anywhere; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#000; --card:#1c1c1e; --text:#fff; --muted:#a6a6ad; --line:#38383a; --field:#2c2c2e; --shadow:none; --blue:#4aa8ff; --danger:#ff6961; }
      body { background:#000; }
      input { outline:none; }
      input:focus { border-color:var(--blue); }
    }
  </style>
</head>
<body>
  <div id="content-area">
    <div class="buttons-container">
      <button id="back-to-menu" class="back-button" type="button" onclick="window.location.href = 'index.html';">
        <img src="svg/arrow-prev.svg" alt="Back" class="back-button-icon">
        <span class="back-button-text" data-i18n="settings.main.back">Back</span>
      </button>
    </div>

    <div class="scrollable-content ical-content">
      <div class="content-header">
        <header class="homey-header">
          <div style="width:100%;text-align:center;">
            <img class="banner" src="https://raw.githubusercontent.com/LRvdLinden/Homey_Brands/main/Birthdays/settings_banner.png" alt="">
          </div>
          <h1 class="homey-title" data-i18n="settings.ical.title">iCal calendars</h1>
        </header>
      </div>

  <div class="section-title" data-i18n="settings.ical.subscription">Subscription</div>
  <div class="card">
    <div class="field">
      <label for="ical-name" data-i18n="settings.ical.name">Calendar name</label>
      <input id="ical-name" type="text" data-i18n-placeholder="settings.ical.namePlaceholder">
    </div>
    <div class="field">
      <label for="ical-url" data-i18n="settings.ical.url">iCal subscription URL</label>
      <input id="ical-url" type="url" inputmode="url" autocapitalize="none" autocomplete="off" data-i18n-placeholder="settings.ical.urlPlaceholder">
    </div>
    <button id="ical-add" class="homey-button-primary-full" type="button" data-i18n="settings.ical.add">Add subscription</button>
  </div>

  <div class="section-title" data-i18n="settings.ical.uploadedFile">Uploaded file</div>
  <div class="card">
    <div class="field">
      <label for="ical-file" data-i18n="settings.ical.upload">Upload iCal file</label>
      <input id="ical-file" type="file" accept=".ics,text/calendar">
    </div>
    <button id="ical-import" class="homey-button-secondary-full" type="button" data-i18n="settings.ical.import">Import file</button>
  </div>

  <div class="section-title" data-i18n="settings.ical.addedCalendars">Added calendars</div>
  <div id="ical-sources"></div>
  <button id="ical-sync" class="homey-button-secondary-full" type="button" data-i18n="settings.ical.sync">Synchronize now</button>
  <div id="status" aria-live="polite"></div>

    </div>
  </div>

  <script>
    let myHomey;
    let currentSources = [];
    let currentSyncStatus = {};

    function getSetting(key) {
      return new Promise(function(resolve, reject) {
        let done = false;
        function finish(error, value) {
          if (done) return;
          done = true;
          if (error) reject(error); else resolve(value);
        }
        try {
          const result = myHomey.get(key, finish);
          if (result && typeof result.then === 'function') result.then(value => finish(null, value)).catch(finish);
        } catch (error) { finish(error); }
      });
    }

    function setSetting(key, value) {
      return new Promise(function(resolve, reject) {
        let done = false;
        function finish(error) {
          if (done) return;
          done = true;
          if (error) reject(error); else resolve();
        }
        try {
          const result = myHomey.set(key, value, finish);
          if (result && typeof result.then === 'function') result.then(() => finish()).catch(finish);
        } catch (error) { finish(error); }
      });
    }

    function api(method, path, body) {
      return new Promise(function(resolve, reject) {
        let done = false;
        function finish(error, result) {
          if (done) return;
          done = true;
          if (error) reject(error); else resolve(result);
        }
        try {
          const result = myHomey.api(method, path, body, finish);
          if (result && typeof result.then === 'function') result.then(value => finish(null, value)).catch(finish);
        } catch (error) { finish(error); }
      });
    }

    function errorText(error) {
      const value = error && error.message ? error.message : String(error || '');
      if (/<!doctype|<html|cannot\s+(post|get)/i.test(value)) return myHomey.__('settings.ical.apiUnavailable');
      return value.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function formatDate(value) {
      if (!value) return myHomey.__('settings.ical.never');
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? myHomey.__('settings.ical.never') : date.toLocaleString();
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderSources() {
      const container = document.getElementById('ical-sources');
      container.innerHTML = '';
      if (!currentSources.length) {
        container.appendChild(element('div', 'card empty', myHomey.__('settings.ical.none')));
        return;
      }

      currentSources.forEach(function(source) {
        const status = (currentSyncStatus.sources || {})[source.id] || {};
        const upload = source.type === 'upload' || (!source.url && source.fileName);
        const card = element('div', 'card source-card');
        const top = element('div', 'source-top');
        const copy = element('div', 'source-copy');
        copy.appendChild(element('span', 'source-name', source.name || source.fileName || source.url || 'iCal'));
        copy.appendChild(element('span', 'source-type', myHomey.__(upload ? 'settings.ical.uploadedFile' : 'settings.ical.subscription')));
        const count = source.count !== undefined ? source.count : status.count;
        const updated = source.lastImportedAt || status.syncedAt || currentSyncStatus.syncedAt;
        copy.appendChild(element('span', 'source-meta',
          myHomey.__('settings.ical.birthdayCount') + ': ' + (count !== undefined ? count : '—') +
          ' · ' + myHomey.__('settings.ical.lastUpdated') + ': ' + formatDate(updated)));
        top.appendChild(copy);
        const remove = element('button', 'homey-button-danger-shadow ical-remove-button', myHomey.__('settings.ical.remove'));
        remove.type = 'button';
        remove.addEventListener('click', () => removeSource(source.id));
        top.appendChild(remove);
        card.appendChild(top);
        card.appendChild(element('div', 'source-url',
          upload ? myHomey.__('settings.ical.fileName') + ': ' + (source.fileName || source.name || 'iCal.ics') : source.url));
        if (status.ok === false) card.appendChild(element('div', 'source-error', errorText(status.error)));
        container.appendChild(card);
      });
    }

    async function refresh() {
      const values = await Promise.all([getSetting('icalSources'), getSetting('icalSyncStatus')]);
      currentSources = Array.isArray(values[0]) ? values[0] : [];
      currentSyncStatus = values[1] && typeof values[1] === 'object' ? values[1] : {};
      renderSources();
    }

    async function sync(showMessage) {
      const result = await api('POST', '/ical/sync', {});
      currentSyncStatus = result || {};
      await refresh();
      const entries = Object.values(result.sources || {});
      const count = entries.reduce((total, item) => total + (item.count || 0), 0);
      const failed = entries.filter(item => item.ok === false).length;
      document.getElementById('status').textContent = failed
        ? myHomey.__('settings.ical.syncFailed').replace('__count__', failed)
        : myHomey.__('settings.ical.synced').replace('__count__', count);
      if (showMessage && !failed && count === 0) {
        document.getElementById('status').textContent += ' ' + myHomey.__('settings.ical.noEvents');
      }
      return result;
    }

    async function removeSource(id) {
      try {
        currentSources = currentSources.filter(source => source.id !== id);
        await setSetting('icalSources', currentSources);
        const persons = await getSetting('persons');
        if (Array.isArray(persons)) await setSetting('persons', persons.filter(person => person.icalSourceId !== id));
        renderSources();
      } catch (error) {
        myHomey.alert(myHomey.__('settings.ical.error') + ' ' + errorText(error));
        await refresh();
      }
    }

    function readFile(file) {
      if (typeof file.text === 'function') return file.text();
      return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(reader.error || new Error('File read failed'));
        reader.readAsText(file);
      });
    }

    function onHomeyReady(Homey) {
      myHomey = Homey;
      const language = Homey.getLanguage ? Homey.getLanguage() : 'en';
      document.documentElement.lang = language;
      document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n-placeholder]').forEach(function(input) {
        input.placeholder = Homey.__(input.getAttribute('data-i18n-placeholder'));
      });

      document.getElementById('ical-add').addEventListener('click', async function(event) {
        const button = event.currentTarget;
        let url = document.getElementById('ical-url').value.trim();
        const name = document.getElementById('ical-name').value.trim() || 'iCal';
        if (/^webcal:\/\//i.test(url)) url = url.replace(/^webcal:\/\//i, 'https://');
        if (!/^https?:\/\//i.test(url)) return myHomey.alert(myHomey.__('settings.ical.invalidUrl'));
        button.disabled = true;
        try {
          const stored = await getSetting('icalSources');
          const sources = Array.isArray(stored) ? stored.slice() : [];
          sources.push({ id:'url-' + Date.now().toString(36), type:'subscription', name, url, enabled:true, createdAt:new Date().toISOString() });
          await setSetting('icalSources', sources);
          currentSources = sources;
          renderSources();
          document.getElementById('ical-url').value = '';
          document.getElementById('ical-name').value = '';
          document.getElementById('status').textContent = myHomey.__('settings.ical.syncing');
          await sync(true);
        } catch (error) {
          document.getElementById('status').textContent = myHomey.__('settings.ical.error') + ' ' + errorText(error);
        } finally { button.disabled = false; }
      });

      document.getElementById('ical-sync').addEventListener('click', async function(event) {
        const button = event.currentTarget;
        button.disabled = true;
        document.getElementById('status').textContent = myHomey.__('settings.ical.syncing');
        try { await sync(true); }
        catch (error) { document.getElementById('status').textContent = myHomey.__('settings.ical.error') + ' ' + errorText(error); }
        finally { button.disabled = false; }
      });

      document.getElementById('ical-import').addEventListener('click', async function(event) {
        const button = event.currentTarget;
        const file = document.getElementById('ical-file').files[0];
        if (!file) return myHomey.alert(myHomey.__('settings.ical.chooseFile'));
        button.disabled = true;
        const sourceId = 'upload-' + Date.now().toString(36);
        const name = file.name.replace(/\.ics$/i, '') || 'iCal';
        try {
          const result = await api('POST', '/ical/import', { content:await readFile(file), name, sourceId });
          const stored = await getSetting('icalSources');
          const sources = Array.isArray(stored) ? stored.slice() : [];
          sources.push({ id:sourceId, type:'upload', name, fileName:file.name, enabled:true, count:result.count || 0, lastImportedAt:new Date().toISOString() });
          await setSetting('icalSources', sources);
          currentSources = sources;
          renderSources();
          document.getElementById('ical-file').value = '';
          document.getElementById('status').textContent =
            myHomey.__('settings.ical.imported').replace('__count__', result.count || 0) +
            ((result.count || 0) === 0 ? ' ' + myHomey.__('settings.ical.noEvents') : '');
        } catch (error) {
          document.getElementById('status').textContent = myHomey.__('settings.ical.error') + ' ' + errorText(error);
        } finally { button.disabled = false; }
      });

      refresh()
        .catch(error => { document.getElementById('status').textContent = myHomey.__('settings.ical.loadError') + ' ' + errorText(error); })
        .finally(() => Homey.ready());
    }
  </script>
</body>
</html>
